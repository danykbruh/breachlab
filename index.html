  <span class="foot-links"><button type="button" id="installBtn" class="link" hidden>Установить приложение</button><a href="#/rules">Правила и конфиденциальность</a></span>
</footer>
<script>
// Установка как приложение (PWA): регистрируем service worker
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
// Кнопка «Установить приложение» появляется, когда браузер это разрешает (Chrome, Edge, Android)
let installEvt = null;
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; document.getElementById("installBtn").hidden = false; });
document.getElementById("installBtn").addEventListener("click", async () => {
  if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null;
  document.getElementById("installBtn").hidden = true;
});
</script>
